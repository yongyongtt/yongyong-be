upstream app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Internal APIs are never reachable from outside
    location ^~ /api/internal/ {
        return 403;
    }

    # Only health is exposed; other /actuator paths fall through to 404
    location = /health {
        proxy_pass http://app/actuator/health;
    }

    location /api/ {
        proxy_pass http://app;
    }

    # Swagger stays open for the frontend team.
    # To block it later, replace the three blocks below with:
    #   location ~ ^/(swagger-ui|v3/api-docs) { return 403; }
    location = /swagger-ui.html {
        proxy_pass http://app;
    }

    location /swagger-ui/ {
        proxy_pass http://app;
    }

    location /v3/api-docs {
        proxy_pass http://app;
    }

    location / {
        return 404;
    }
}
