spring.application.name=yongyong

# Load secrets such as DB_PASSWORD from .env (not committed)
spring.config.import=optional:file:.env[.properties]

# Connects straight to yongin with a SELECT-only account (decisions D15).
# Write protection comes from the DB account grants.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/yongin}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Never let Hibernate change the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Swagger UI: document /api/** only, sorted, with "Try it out" open by default
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.paths-to-exclude=/api/internal/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Allowed CORS origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator: expose health only. Component status (db) is shown, details are not
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
