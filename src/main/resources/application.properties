spring.application.name=yongyong

# Load secrets such as DB_PASSWORD from .env (not committed)
spring.config.import=optional:file:.env[.properties]

# Connects to yongin_app by default. yongin tables are reached through @Table(catalog = "yongin").
# Write protection for yongin comes from the DB account grants (SELECT only).
spring.datasource.url=jdbc:mariadb://localhost:3307/yongin_app
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Never let Hibernate change the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Allowed CORS origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
